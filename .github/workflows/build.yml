name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the installers (Releases) and the build log (ci-logs branch)

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Macs build the Apple Silicon app (GitHub's Apple Silicon machines are often all busy), like Media Hub.
          - { os: macos-15-intel, label: mac, bundles: "app,dmg", target: aarch64-apple-darwin }
          - { os: windows-latest, label: windows, bundles: nsis }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript packages
        run: npm install --no-audit --no-fund 2>&1 | tee -a ci.log

      # ffmpeg, ffprobe and deno ship inside the app (Tauri "sidecars"), so nothing has to be installed by hand.
      - name: Fetch ffmpeg and deno
        # For another chip the programs can't be started here, so the start-up check is skipped.
        run: TRIPLE="${{ matrix.target }}" SKIP_RUN="${{ matrix.target && '1' || '' }}" bash scripts/fetch-sidecars.sh 2>&1 | tee -a ci.log

      - name: Type-check the window
        run: npx tsc --noEmit 2>&1 | tee -a ci.log

      # Tests run for this machine's own chip; when building for another chip, its helper programs only need to exist.
      - name: Placeholders for the test run
        if: matrix.target
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          for t in ffmpeg ffprobe deno; do [ -e "src-tauri/binaries/$t-$host" ] || : > "src-tauri/binaries/$t-$host"; done

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee -a ci.log

      - name: Build installer
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} 2>&1 | tee -a ci.log

      # One release per version (v1.1.0, ...), like Media Hub. The .app.tar.gz and the Windows
      # installer are what Goblin's in-app updater downloads, checked against the SHA256SUMS files.
      # deno (YouTube's player code) crashes under "hardened runtime" ("Failed to reserve virtual memory").
      - name: Check Mac signing
        if: matrix.label == 'mac'
        run: |
          app=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/Goblin.app)
          for f in "$app"/Contents/MacOS/*; do
            flags=$(codesign -dv "$f" 2>&1 | grep -o 'flags=[^ ]*' || true)
            echo "$(basename "$f"): $flags"
            case "$flags" in *runtime*) echo "::error::$(basename "$f") is signed with hardened runtime"; exit 1;; esac
          done

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v$version"
          mkdir -p out
          if [ "${{ matrix.label }}" = "mac" ]; then
            b=src-tauri/target/${{ matrix.target }}/release/bundle
            [ -d "$b" ] || b=src-tauri/target/release/bundle
            tar -czf out/Goblin-macos.app.tar.gz -C "$b/macos" "Goblin.app"
            cp "$b"/dmg/*.dmg out/Goblin-macos.dmg
            (cd out && shasum -a 256 Goblin-macos.app.tar.gz Goblin-macos.dmg > SHA256SUMS-macos.txt)
          else
            cp src-tauri/target/release/bundle/nsis/*-setup.exe out/Goblin-windows-setup.exe
            (cd out && sha256sum Goblin-windows-setup.exe > SHA256SUMS-windows.txt)
          fi
          # Old per-build pre-releases from the first version of this workflow.
          for old in $(gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^build-[0-9]+-(mac|windows)$' || true); do
            gh release delete "$old" --yes --cleanup-tag || true
          done
          # Both computers add their files to the same release.
          # (Both may try to create it at the same moment; whoever is second just uploads.)
          {
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Goblin $version" --notes "Download Goblin-macos.dmg (Mac) or Goblin-windows-setup.exe (Windows). Already installed? Goblin updates itself: Settings → Goblin updates." || true
            ok=0
            for i in 1 2 3 4; do
              sleep $((i * 5))
              if gh release upload "$tag" out/* --clobber; then ok=1; break; fi
              echo "upload try $i failed, retrying"
            done
            [ "$ok" = 1 ]
          } 2>&1 | tee -a ci.log
          exit "${PIPESTATUS[0]}"

      # Always runs, also after a failure: copies the log (and the lock files, which
      # pin the exact package versions) to a branch so it can be read and fixed.
      - name: Save build log
        if: always()
        run: |
          mkdir -p ../ci-logs-work && cd ../ci-logs-work
          rm -rf repo && mkdir repo && cd repo
          git init -q -b ci-logs
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin ci-logs || true
          git checkout -q ci-logs 2>/dev/null || git checkout -q -b ci-logs
          git reset -q --hard FETCH_HEAD 2>/dev/null || true
          mkdir -p "${{ matrix.label }}"
          cp "$GITHUB_WORKSPACE/ci.log" "${{ matrix.label }}/ci.log" || echo "no log produced" > "${{ matrix.label }}/ci.log"
          echo "job status: ${{ job.status }}  commit: ${{ github.sha }}  run: ${{ github.run_number }}" > "${{ matrix.label }}/status.txt"
          if [ "${{ matrix.label }}" = "mac" ]; then
            cp "$GITHUB_WORKSPACE/package-lock.json" . 2>/dev/null || true
            cp "$GITHUB_WORKSPACE/src-tauri/Cargo.lock" . 2>/dev/null || true
          fi
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "log: ${{ matrix.label }} run ${{ github.run_number }}" || exit 0
          for i in 1 2 3 4 5; do
            git push -q origin ci-logs && exit 0
            git fetch -q --depth 1 origin ci-logs && git rebase -q FETCH_HEAD || true
            sleep 3
          done
          exit 0
